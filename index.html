<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHTSA Vehicle Complaints Explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='8' width='28' height='16' rx='3' fill='%232d5f8a'/><circle cx='9' cy='24' r='3' fill='%231a3a5c' stroke='%23fff' stroke-width='1'/><circle cx='23' cy='24' r='3' fill='%231a3a5c' stroke='%23fff' stroke-width='1'/><rect x='6' y='11' width='8' height='6' rx='1' fill='%23edf5fc'/><rect x='16' y='11' width='10' height='6' rx='1' fill='%23edf5fc'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#e8f0f8;--card:#F5F0E8;--ink:#1e2a35;--mid:#3a4a57;--light:#5a6a7a;--rule:#ddd8ce;
  --red:#B91C1C;--red-bg:#FEE2E2;--amber:#B45309;--amber-bg:#FEF3C7;--green:#15803D;--green-bg:#DCFCE7;
  --blue:#2d5f8a;--violet:#7C3AED;--cyan:#0891B2;--pink:#DB2777;--indigo:#4F46E5;
  --mono:'JetBrains Mono',monospace;--sans:'DM Sans',system-ui;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink)}
.shell{max-width:1280px;margin:0 auto;padding:0 20px}

.hdr{display:none}

.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:10px 12px}
.stat .l{font-family:var(--mono);font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--light)}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-1px;margin-top:1px}
.stat .v.red{color:var(--red)}.stat .v.amber{color:var(--amber)}.stat .v.green{color:var(--green)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--light)}
.fg select,.fg input{font-family:var(--sans);font-size:13px;padding:6px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink)}
.fg select:focus,.fg input:focus{outline:none;border-color:#2d5f8a}
.btn{font-family:var(--mono);font-size:10px;font-weight:600;padding:7px 14px;border:2px solid #2d5f8a;background:#2d5f8a;color:#fff;border-radius:3px;cursor:pointer;letter-spacing:0.5px;text-transform:uppercase}
.btn:hover{background:#1a3a5c;border-color:#1a3a5c}
.btn-o{background:transparent;color:var(--ink)}.btn-o:hover{background:var(--ink);color:#fff}
.chk{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--mid);cursor:pointer}
.chk input{accent-color:#2d5f8a}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:5px;margin-bottom:16px;overflow:hidden}
.panel-hdr{padding:8px 14px;font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--light);border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}

/* Chart */
.chart-wrap{padding:12px 14px}

/* Table */
.tbl-scroll{max-height:500px;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:768px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .filters{flex-direction:column;align-items:stretch}
  .fg select,.fg input{width:100%}
  table{min-width:700px}
}
table{width:100%;border-collapse:collapse}
thead{position:sticky;top:0;z-index:2}
th{font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--light);padding:6px 10px;text-align:left;background:#F5F0E8;border-bottom:2px solid #2d3d4a;cursor:pointer;white-space:nowrap;overflow:hidden}
th:hover{color:var(--ink)}
th.r{text-align:right}
th.sorted::after{color:#2d5f8a;font-size:7px}
th.asc::after{content:" \25B2"}th.desc::after{content:" \25BC"}
td{font-size:12px;padding:5px 10px;border-bottom:1px solid var(--rule);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mid)}
td.name{color:var(--ink);font-weight:500;cursor:pointer}
td.name:hover{color:#2d5f8a;text-decoration:underline}
td.num{text-align:right;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink)}
td.red{color:var(--red);font-weight:600}
tr:hover td{background:#efe9df}
tr.selected td{background:#efe9df!important}
.bar-cell{display:flex;align-items:center;gap:6px}
.bar-fill{height:12px;background:#2d5f8a;border-radius:1px;opacity:0.7}

.badge{display:inline-block;font-family:var(--mono);font-size:8px;font-weight:700;padding:2px 5px;border-radius:2px}
.badge-r{background:var(--red-bg);color:var(--red)}.badge-a{background:var(--amber-bg);color:var(--amber)}.badge-g{background:var(--green-bg);color:var(--green)}

/* Compare tags */
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.tag{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:3px;border-left:3px solid;cursor:pointer}
.tag .x{margin-left:4px;opacity:0.5}
.tag .x:hover{opacity:1}

/* Detail */
.detail-hdr{padding:10px 14px;background:#F5F0E8;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
.detail-hdr h3{font-size:14px;font-weight:700}
td.summary{max-width:350px;cursor:pointer}
td.summary.expanded{white-space:normal;background:#efe9df}

.loading{text-align:center;padding:30px;font-family:var(--mono);font-size:11px;color:var(--light)}
.footer{padding:14px 0;border-top:1px solid var(--rule);margin-top:16px;font-family:var(--mono);font-size:9px;color:var(--light);text-align:center}
</style>
</head>
<body>
<div class="shell">

  <div class="filters">
    <div class="fg"><label>Make</label><select id="f-make"><option value="">All Makes</option></select></div>
    <div class="fg"><label>Model</label><select id="f-model"><option value="">All Models</option></select></div>
    <div class="fg"><label>Model Year</label>
      <select id="f-year"><option value="">All Years</option></select>
    </div>
    <div class="fg"><label>Sort By</label>
      <select id="f-sort">
        <option value="total-d">Total Complaints</option>
        <option value="crashes-d">Crashes</option>
        <option value="deaths-d">Deaths</option>
        <option value="injuries-d">Injuries</option>
        <option value="fires-d">Fires</option>
        <option value="make-a">Make A-Z</option>
        <option value="make-d">Make Z-A</option>
        <option value="total-a">Complaints (low)</option>
        <option value="crashes-a">Crashes (low)</option>
        <option value="deaths-a">Deaths (low)</option>
        <option value="injuries-a">Injuries (low)</option>
        <option value="fires-a">Fires (low)</option>
      </select>
    </div>
    <label class="chk"><input type="checkbox" id="f-crash" onchange="refresh()"> Has Crashes</label>
    <label class="chk"><input type="checkbox" id="f-fire" onchange="refresh()"> Has Fires</label>
    <label class="chk"><input type="checkbox" id="f-death" onchange="refresh()"> Has Deaths</label>
    <div class="fg"><label>&nbsp;</label><button class="btn" onclick="exportCSV()">Export CSV</button></div>
    <div class="fg"><label>&nbsp;</label><button class="btn btn-o" onclick="clearFilters()">Clear</button></div>
  </div>

  <!-- Aggregate Timeline -->
  <div class="panel">
    <div class="panel-hdr"><span id="agg-title">Total Complaints by Year Filed</span><div id="chart-toggle" style="display:none"><select id="f-chartmode" style="font-family:var(--mono);font-size:10px;padding:3px 8px;border:1px solid var(--rule);border-radius:3px"><option value="filed_year">By Year Filed</option><option value="model_year">By Model Year</option></select></div></div>
    <div class="chart-wrap" id="agg-chart"></div>
  </div>

  <!-- Comparison Chart -->
  <div class="panel" id="cmp-panel" style="display:none">
    <div class="panel-hdr"><span id="cmp-title">Complaints Over Time</span><button class="btn btn-o" onclick="clearCompare()" style="padding:3px 8px;font-size:9px">Clear</button></div>
    <div class="tags" id="cmp-tags"></div>
    <div class="chart-wrap" id="cmp-chart"></div>
  </div>

  <!-- Leaderboard -->
  <div class="panel">
    <div class="panel-hdr"><span id="tbl-info">Loading...</span></div>
    <div class="tbl-scroll" id="tbl-wrap"></div>
  </div>

  <!-- Detail Drill-Down -->
  <div class="panel" id="detail-panel" style="display:none">
    <div class="detail-hdr">
      <h3 id="detail-title"></h3>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="detail-year" style="font-family:var(--mono);font-size:11px;padding:4px 8px;border:1px solid var(--rule);border-radius:3px"></select>
        <button class="btn btn-o" onclick="closeDetail()" style="padding:3px 8px;font-size:9px">Close</button>
      </div>
    </div>
    <div id="detail-body"><div class="loading">Select a year to load individual complaints</div></div>
  </div>

  <div class="footer" id="footer">Data scraped from NHTSA API &middot; AH Datalytics 2026</div>
</div>

<script>
let DATA, vehicles, compare=[], chartMode='model_year';
const COLORS=['#2d5f8a','#c4652a','#2a8a5a','#8040a0','#b8960a','#c43838','#1a8a8a','#6050b0'];

function niceAxis(maxV){
  if(maxV<=0)return{step:1,max:4,ticks:[0,1,2,3,4]};
  const rough=maxV/4;
  const mag=Math.pow(10,Math.floor(Math.log10(rough)));
  const opts=[1,2,2.5,5,10];
  let step=opts.find(o=>o*mag>=rough)*mag;
  const niceMax=Math.ceil(maxV/step)*step;
  const ticks=[];for(let i=0;i<=4&&i*step<=niceMax;i++)ticks.push(i*step);
  if(ticks[ticks.length-1]<niceMax)ticks.push(niceMax);
  return{step,max:niceMax,ticks};
}

async function init(){
  try{
    const el=document.getElementById('nhtsa-data');
    if(!el){document.getElementById('tbl-wrap').innerHTML='<div class="loading" style="color:red">Data tag not found</div>';return;}
    const b64=el.textContent.trim();
    if(!b64){document.getElementById('tbl-wrap').innerHTML='<div class="loading" style="color:red">Data tag empty</div>';return;}
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    // Try DecompressionStream first, fallback to pako if needed
    let raw;
    if(typeof DecompressionStream!=='undefined'){
      const ds=new DecompressionStream('gzip');
      const w=ds.writable.getWriter();w.write(bin);w.close();
      const r=ds.readable.getReader();const ch=[];
      while(true){const{done,value}=await r.read();if(done)break;ch.push(value);}
      raw=await new Blob(ch).text();
    }else{
      document.getElementById('tbl-wrap').innerHTML='<div class="loading" style="color:red">DecompressionStream not supported</div>';return;
    }
    DATA=JSON.parse(raw);
    vehicles=DATA.vehicles;
    if(DATA.filed_years){document.getElementById('chart-toggle').style.display='block';chartMode='filed_year';document.getElementById('f-chartmode').value='filed_year';}
    buildMakes();renderTable();renderAggChart();
    document.getElementById('footer').textContent='Data scraped from NHTSA API \u00B7 '+vehicles.length+' vehicles \u00B7 Model years '+DATA.years[0]+'-'+DATA.years[DATA.years.length-1]+' \u00B7 AH Datalytics 2026';
  }catch(e){
    document.getElementById('tbl-wrap').innerHTML='<div class="loading" style="color:red">Error: '+e.message+'</div>';
    console.error('Init error:',e);
  }
}

function toggleChartMode(){
  chartMode=document.getElementById('f-chartmode').value;
  document.getElementById('agg-title').textContent=chartMode==='model_year'?'Total Complaints by Model Year':'Total Complaints by Year Filed';
  renderAggChart();
  if(compare.length)renderCompare();
}

function renderAggChart(){
  const f=getFiltered();
  const useFiled=chartMode==='filed_year'&&DATA.filed_years;
  const title=document.getElementById('agg-title');
  title.textContent=useFiled?'Total Complaints by Year Filed':'Total Complaints by Model Year';

  let years,byYear={};
  if(useFiled){
    const allYrs=new Set();
    f.forEach(v=>{if(v.by_filed_year)Object.keys(v.by_filed_year).forEach(y=>allYrs.add(parseInt(y)));});
    if(!allYrs.size){years=DATA.years;f.forEach(v=>{years.forEach(y=>{byYear[y]=(byYear[y]||0)+(v.by_year[y]||0);});});}
    else{years=[...allYrs].sort((a,b)=>a-b);years.forEach(y=>byYear[y]=0);f.forEach(v=>{if(v.by_filed_year)Object.entries(v.by_filed_year).forEach(([y,c])=>{byYear[parseInt(y)]=(byYear[parseInt(y)]||0)+c;});});}
  }else{
    years=DATA.years;years.forEach(y=>byYear[y]=0);
    f.forEach(v=>{years.forEach(y=>{byYear[y]+=(v.by_year[y]||0);});});
  }

  const rawMax=Math.max(1,...Object.values(byYear));
  const ax=niceAxis(rawMax);const maxV=ax.max;
  const W=900,H=160,pL=55,pR=20,pT=10,pB=25;
  const pw=W-pL-pR,ph=H-pT-pB;
  const barW=Math.min(40,(pw/years.length)-4);
  const step=pw/years.length;
  let svg='<svg width="100%" viewBox="0 0 '+W+' '+H+'">';
  ax.ticks.forEach((val,i)=>{const y=pT+ph-(val/maxV)*ph;
    svg+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="#E7E5E4" stroke-width="0.5"/>';
    svg+='<text x="'+(pL-6)+'" y="'+(y+3)+'" text-anchor="end" fill="#78716C" font-family="IBM Plex Mono" font-size="9">'+val.toLocaleString()+'</text>';});
  years.forEach((yr,i)=>{
    const val=byYear[yr]||0;const barH=(val/maxV)*ph;
    const x=pL+i*step+(step-barW)/2;const y=pT+ph-barH;
    svg+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+barH+'" fill="'+(useFiled?'#4a7aaa':'#2d5f8a')+'" rx="2" opacity="0.8"><title>'+yr+': '+val.toLocaleString()+'</title></rect>';
    svg+='<text x="'+(x+barW/2)+'" y="'+(H-6)+'" text-anchor="middle" fill="#1C1917" font-family="IBM Plex Mono" font-size="10" font-weight="600">'+yr+'</text>';
    if(val>0)svg+='<text x="'+(x+barW/2)+'" y="'+(y-4)+'" text-anchor="middle" fill="#78716C" font-family="IBM Plex Mono" font-size="8">'+val.toLocaleString()+'</text>';
  });
  svg+='</svg>';
  document.getElementById('agg-chart').innerHTML=svg;
}

function buildMakes(){
  const makes=[...new Set(vehicles.map(v=>v.make))].sort();
  const sel=document.getElementById('f-make');
  makes.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});
  const ySel=document.getElementById('f-year');
  DATA.years.slice().reverse().forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;ySel.appendChild(o);});
}
function updateModels(){
  const make=document.getElementById('f-make').value;
  const sel=document.getElementById('f-model');
  const cur=sel.value;
  sel.innerHTML='<option value="">All Models</option>';
  if(make){
    const models=[...new Set(vehicles.filter(v=>v.make===make).map(v=>v.model))].sort();
    models.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});
    if(models.includes(cur))sel.value=cur;
  }
}

function getFiltered(){
  const yr=document.getElementById('f-year').value;
  let f=vehicles.map(v=>{
    if(!yr) return v;
    // Recalculate totals for just this year from detail records
    const det=DATA.detail.filter(d=>d.make===v.make&&d.model===v.model&&d.year===parseInt(yr));
    if(!det.length) return null;
    const d=det[0];
    return {...v, total:d.count, crashes:d.crashes, fires:d.fires, injuries:d.injuries, deaths:d.deaths, _filtered:true};
  }).filter(Boolean);
  const make=document.getElementById('f-make').value;
  const model=document.getElementById('f-model').value;
  const crash=document.getElementById('f-crash').checked;
  const fire=document.getElementById('f-fire').checked;
  const death=document.getElementById('f-death').checked;
  if(make)f=f.filter(v=>v.make===make);
  if(model)f=f.filter(v=>v.model===model);
  if(crash)f=f.filter(v=>v.crashes>0);
  if(fire)f=f.filter(v=>v.fires>0);
  if(death)f=f.filter(v=>v.deaths>0);
  const[key,dir]=document.getElementById('f-sort').value.split('-');
  const d=dir==='d'?-1:1;
  f.sort((a,b)=>{
    if(key==='make'){const va=a.make+a.model,vb=b.make+b.model;return va<vb?-d:va>vb?d:0;}
    return((a[key]||0)-(b[key]||0))*d;
  });
  return f;
}

function renderStats(){
  const f=getFiltered();
  const t=f.reduce((s,v)=>s+v.total,0);
  const cr=f.reduce((s,v)=>s+v.crashes,0);
  const fi=f.reduce((s,v)=>s+v.fires,0);
  const inj=f.reduce((s,v)=>s+v.injuries,0);
  const de=f.reduce((s,v)=>s+v.deaths,0);
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="l">Vehicles</div><div class="v">'+f.length+'</div></div>'+
    '<div class="stat"><div class="l">Total Complaints</div><div class="v">'+t.toLocaleString()+'</div></div>'+
    '<div class="stat"><div class="l">Crashes</div><div class="v red">'+cr.toLocaleString()+'</div></div>'+
    '<div class="stat"><div class="l">Fires</div><div class="v amber">'+fi.toLocaleString()+'</div></div>'+
    '<div class="stat"><div class="l">Injuries</div><div class="v red">'+inj.toLocaleString()+'</div></div>'+
    '<div class="stat"><div class="l">Deaths</div><div class="v red">'+de.toLocaleString()+'</div></div>';
}

function renderTable(){
  const f=getFiltered();
  const max=f.length?f[0].total:1;
  document.getElementById('tbl-info').textContent=f.length+' vehicles';
  const sv=document.getElementById('f-sort').value;
  function thc(k){return sv.startsWith(k)?(' sorted '+(sv.endsWith('-d')?'desc':'asc')):''}
  let h='<table><thead><tr><th style="width:4%">#</th><th style="width:9%" onclick="colSort(\'make\')" class="'+thc('make')+'">Make</th><th style="width:11%">Model</th><th style="width:26%" onclick="colSort(\'total\')" class="'+thc('total')+'">Complaints</th><th class="r'+thc('crashes')+'" style="width:7%" onclick="colSort(\'crashes\')">Crashes</th><th class="r'+thc('fires')+'" style="width:6%" onclick="colSort(\'fires\')">Fires</th><th class="r'+thc('injuries')+'" style="width:7%" onclick="colSort(\'injuries\')">Injuries</th><th class="r'+thc('deaths')+'" style="width:6%" onclick="colSort(\'deaths\')">Deaths</th><th style="width:8%"></th><th style="width:4%"></th></tr></thead><tbody>';
  f.forEach((v,i)=>{
    const pct=(v.total/max*100).toFixed(0);
    const sel=compare.some(c=>c.make===v.make&&c.model===v.model)?'selected':'';
    h+='<tr class="'+sel+'" data-make="'+v.make+'" data-model="'+v.model+'">';
    h+='<td style="font-family:var(--mono);font-size:10px;color:var(--light)">'+(i+1)+'</td>';
    h+='<td>'+v.make+'</td>';
    h+='<td class="name" onclick="drillDown(\''+v.make+'\',\''+v.model.replace(/'/g,"\\'")+'\')">'+v.model+'</td>';
    h+='<td><div class="bar-cell"><div class="bar-fill" style="width:'+pct+'%"></div><span class="num" style="font-family:var(--mono);font-size:11px;font-weight:600">'+v.total.toLocaleString()+'</span></div></td>';
    h+='<td class="num'+(v.crashes>0?' red':'')+'">'+v.crashes.toLocaleString()+'</td>';
    h+='<td class="num'+(v.fires>0?' red':'')+'">'+v.fires.toLocaleString()+'</td>';
    h+='<td class="num'+(v.injuries>0?' red':'')+'">'+v.injuries.toLocaleString()+'</td>';
    h+='<td class="num'+(v.deaths>0?' red':'')+'">'+v.deaths.toLocaleString()+'</td>';
    h+='<td><button class="btn btn-o" style="padding:2px 6px;font-size:8px" onclick="drillDown(\''+v.make+'\',\''+v.model.replace(/'/g,"\\'")+'\')">View</button></td>';
    const inCmp=compare.some(c=>c.make===v.make&&c.model===v.model);
    h+='<td><button class="btn'+(inCmp?'':' btn-o')+'" style="padding:2px 6px;font-size:8px" onclick="addCompare(\''+v.make+'\',\''+v.model.replace(/'/g,"\\'")+'\')">'+( inCmp?'\u2212':'+')+'</button></td>';
    h+='</tr>';
  });
  h+='</tbody></table>';
  document.getElementById('tbl-wrap').innerHTML=h;
}

// Compare
function addCompare(make,model){
  const idx=compare.findIndex(c=>c.make===make&&c.model===model);
  if(idx>=0){compare.splice(idx,1);renderCompare();renderTable();return;}
  if(compare.length>=8)return;
  const v=vehicles.find(x=>x.make===make&&x.model===model);
  if(!v)return;
  compare.push(v);
  renderCompare();renderTable();
}
function removeCompare(i){compare.splice(i,1);renderCompare();renderTable();}
function clearCompare(){compare=[];renderCompare();renderTable();}
function renderCompare(){
  const p=document.getElementById('cmp-panel');
  if(!compare.length){p.style.display='none';return;}
  p.style.display='block';
  // Tags
  document.getElementById('cmp-title').textContent=chartMode==='filed_year'&&DATA.filed_years?'Complaints by Year Filed':'Complaints by Model Year';
  document.getElementById('cmp-tags').innerHTML=compare.map((v,i)=>
    '<div class="tag" style="background:'+COLORS[i]+'15;color:'+COLORS[i]+';border-color:'+COLORS[i]+'">'+v.make+' '+v.model+' <span class="x" onclick="removeCompare('+i+')">\u2715</span></div>'
  ).join('');
  // Chart — use filed year if available
  const useFiled=chartMode==='filed_year'&&DATA.filed_years;
  let years;
  if(useFiled){
    const allYrs=new Set();
    compare.forEach(v=>{if(v.by_filed_year)Object.keys(v.by_filed_year).forEach(y=>allYrs.add(parseInt(y)));});
    years=allYrs.size?[...allYrs].sort((a,b)=>a-b):DATA.years;
  }else{years=DATA.years;}
  const getVal=(v,yr)=>useFiled?(v.by_filed_year?v.by_filed_year[yr]||0:0):(v.by_year[yr]||0);
  const rawMax2=Math.max(1,...compare.flatMap(v=>years.map(y=>getVal(v,y))));
  const ax2=niceAxis(rawMax2);const maxV=ax2.max;
  const W=900,H=200,pL=50,pR=120,pT=15,pB=25;
  const pw=W-pL-pR,ph=H-pT-pB,sx=pw/(years.length-1||1);
  let svg='<svg width="100%" viewBox="0 0 '+W+' '+H+'">';
  ax2.ticks.forEach((val)=>{const y=pT+ph-(val/maxV)*ph;
    svg+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="#E7E5E4" stroke-width="0.5"/>';
    svg+='<text x="'+(pL-6)+'" y="'+(y+3)+'" text-anchor="end" fill="#78716C" font-family="IBM Plex Mono" font-size="9">'+val.toLocaleString()+'</text>';});
  years.forEach((yr,i)=>{svg+='<text x="'+(pL+i*sx)+'" y="'+(H-4)+'" text-anchor="middle" fill="#78716C" font-family="IBM Plex Mono" font-size="9">'+yr+'</text>';});
  compare.forEach((v,si)=>{
    const c=COLORS[si];let path='';
    years.forEach((yr,i)=>{const val=getVal(v,yr);const x=pL+i*sx;const y=pT+ph-(val/maxV)*ph;
      path+=(i===0?'M':'L')+x+' '+y;
      svg+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+c+'"><title>'+v.make+' '+v.model+' '+yr+': '+val+'</title></circle>';});
    svg+='<path d="'+path+'" fill="none" stroke="'+c+'" stroke-width="2.5"/>';
    svg+='<text x="'+(W-pR+8)+'" y="'+(pT+si*16+10)+'" fill="'+c+'" font-family="IBM Plex Mono" font-size="10" font-weight="600">'+v.make+' '+v.model+'</text>';
  });
  svg+='</svg>';
  document.getElementById('cmp-chart').innerHTML=svg;
}

// Drill-down
let detailMake='',detailModel='';
function drillDown(make,model){
  detailMake=make;detailModel=model;
  const v=vehicles.find(x=>x.make===make&&x.model===model);
  if(!v)return;
  document.getElementById('detail-panel').style.display='block';
  document.getElementById('detail-title').textContent=make+' '+model;
  const sel=document.getElementById('detail-year');
  sel.innerHTML='';
  const allOpt=document.createElement('option');allOpt.value='all';allOpt.textContent='All Years ('+v.total+')';sel.appendChild(allOpt);
  DATA.years.slice().reverse().forEach(yr=>{
    if(v.by_year[yr]){const o=document.createElement('option');o.value=yr;o.textContent=yr+' ('+v.by_year[yr]+')';sel.appendChild(o);}
  });
  if(sel.options.length) loadDetail();
  else document.getElementById('detail-body').innerHTML='<div class="loading">No complaints for this vehicle</div>';
  document.getElementById('detail-panel').scrollIntoView({behavior:'smooth'});
}
function closeDetail(){document.getElementById('detail-panel').style.display='none';}

document.getElementById('detail-year').addEventListener('change',loadDetail);

async function loadDetail(){
  try{
    const yr=document.getElementById('detail-year').value;
    if(!yr)return;
    const v=vehicles.find(x=>x.make===detailMake&&x.model===detailModel);
    let complaints=[];
    if(yr==='all'){
      const yearsWithData=DATA.years.filter(y=>v&&v.by_year[y]);
      document.getElementById('detail-body').innerHTML='<div class="loading">Loading all years ('+yearsWithData.length+')...</div>';
      for(const y of yearsWithData){
        try{
          const resp=await fetch('https://api.nhtsa.gov/complaints/complaintsByVehicle?make='+encodeURIComponent(detailMake)+'&model='+encodeURIComponent(detailModel)+'&modelYear='+y);
          const d=await resp.json();
          if(d.results)complaints.push(...d.results);
          document.getElementById('detail-body').innerHTML='<div class="loading">Loading... '+complaints.length+' complaints</div>';
        }catch(e){}
      }
    }else{
      document.getElementById('detail-body').innerHTML='<div class="loading">Loading '+detailMake+' '+detailModel+' '+yr+'...</div>';
      const resp=await fetch('https://api.nhtsa.gov/complaints/complaintsByVehicle?make='+encodeURIComponent(detailMake)+'&model='+encodeURIComponent(detailModel)+'&modelYear='+yr);
      const d=await resp.json();
      complaints=d.results||[];
    }
    if(!complaints.length){document.getElementById('detail-body').innerHTML='<div class="loading">No complaints returned</div>';return;}
    const crashFilter=document.getElementById('f-crash').checked;
    const fireFilter=document.getElementById('f-fire').checked;
    const deathFilter=document.getElementById('f-death').checked;
    if(crashFilter)complaints=complaints.filter(c=>c.crash);
    if(fireFilter)complaints=complaints.filter(c=>c.fire);
    if(deathFilter)complaints=complaints.filter(c=>c.numberOfDeaths>0);
    if(!complaints.length){document.getElementById('detail-body').innerHTML='<div class="loading">No complaints match current filters</div>';return;}
    let h='<div class="tbl-scroll" style="max-height:400px"><table><thead><tr><th style="width:10%">Date Filed</th><th style="width:15%">Component</th><th style="width:7%">Crash</th><th style="width:7%">Fire</th><th style="width:6%">Inj</th><th style="width:6%">Deaths</th><th style="width:49%">Summary</th></tr></thead><tbody>';
    complaints.sort((a,b)=>new Date(b.dateComplaintFiled||'')-new Date(a.dateComplaintFiled||''));
    complaints.forEach(c=>{
      h+='<tr>';
      h+='<td style="font-family:var(--mono);font-size:10px">'+(c.dateComplaintFiled||'')+'</td>';
      h+='<td style="font-size:11px">'+(c.components||'')+'</td>';
      h+='<td>'+(c.crash?'<span class="badge badge-r">CRASH</span>':'<span class="badge badge-g">No</span>')+'</td>';
      h+='<td>'+(c.fire?'<span class="badge badge-a">FIRE</span>':'<span class="badge badge-g">No</span>')+'</td>';
      h+='<td class="num'+(c.numberOfInjuries>0?' red':'')+'">'+(c.numberOfInjuries||0)+'</td>';
      h+='<td class="num'+(c.numberOfDeaths>0?' red':'')+'">'+(c.numberOfDeaths||0)+'</td>';
      h+='<td class="summary" onclick="this.classList.toggle(\'expanded\')">'+(c.summary||'').replace(/</g,'&lt;')+'</td>';
      h+='</tr>';});
    h+='</tbody></table></div>';
    document.getElementById('detail-body').innerHTML=h;
  }catch(e){document.getElementById('detail-body').innerHTML='<div class="loading" style="color:var(--red)">Error: '+e.message+'</div>';}
}

function exportCSV(){
  const f=getFiltered();
  let csv='Make,Model,Total,Crashes,Fires,Injuries,Deaths,'+DATA.years.join(',')+'\n';
  f.forEach(v=>{csv+=v.make+','+v.model+','+v.total+','+v.crashes+','+v.fires+','+v.injuries+','+v.deaths+','+DATA.years.map(y=>v.by_year[y]||0).join(',')+'\n';});
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nhtsa_complaints.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function clearFilters(){
  document.getElementById('f-make').value='';
  document.getElementById('f-model').innerHTML='<option value="">All Models</option>';
  document.getElementById('f-year').value='';
  document.getElementById('f-sort').value='total-d';
  document.getElementById('f-crash').checked=false;
  document.getElementById('f-fire').checked=false;
  document.getElementById('f-death').checked=false;
  refresh();
}
function refresh(){renderTable();renderAggChart();}
document.getElementById('f-chartmode').addEventListener('change',toggleChartMode);
document.getElementById('f-make').addEventListener('change',()=>{updateModels();refresh();});
document.getElementById('f-model').addEventListener('change',refresh);
document.getElementById('f-sort').addEventListener('change',refresh);
document.getElementById('f-year').addEventListener('change',refresh);

function colSort(key){
  const sel=document.getElementById('f-sort');
  const cur=sel.value;
  if(cur===key+'-d') sel.value=key+'-a';
  else sel.value=key+'-d';
  renderTable();
}

init().catch(e=>{document.getElementById('tbl-wrap').innerHTML='<div class="loading" style="color:red">Fatal: '+e.message+'</div>';console.error(e);});
</script>
</body>
