name: NHTSA Data Update

on:
  schedule:
    - cron: '0 14 10 * *'  # 10th of each month at 9 AM CT (2 PM UTC) - once monthly
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # ~32K API calls; never finished in 120 even before data grew

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape NHTSA API and rebuild dashboard
        run: python scripts/update.py

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel --prod --yes --token $VERCEL_TOKEN --scope ahdatalytics
